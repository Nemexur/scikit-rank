---
model: finalnet
dataset: avazu_x1
num_features: []
cat_features: [feat_1, feat_2, feat_3, feat_4, feat_5, feat_6, feat_7, feat_8, feat_9, feat_10, feat_11, feat_12, feat_13, feat_14, feat_15, feat_16, feat_17, feat_18, feat_19, feat_20, feat_21, feat_22]
data_dir: data/Avazu_x1
max_train_rows: null
verbose: false
deterministic: true

model_params:
  random_state: 2021
  loss: bce
  embedding_dim: 10
  cat_encoder: per_feature

  block_type: 2B
  block1_hidden_units: [800]
  block1_hidden_activations: relu
  block1_dropout: 0.3
  block2_hidden_units: [800, 800]
  block2_hidden_activations: relu
  block2_dropout: 0.2
  batch_norm: true
  residual_type: concat
  interaction_activation: null
  use_field_gate: true
  use_2b_consistency_loss: true

  lr: 1.0e-3
  optimizer: adamw
  optimizer_kwargs:
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    amsgrad: false
  weight_decay: 0.0
  embedding_regularizer: 0.05
  grad_clip_norm: 10
  lr_scheduler: "plateau:patience=0;factor=0.1;min_lr=1e-6"
  epochs: 100
  batch_size: 4096
  early_stopping_rounds: 2
  eval_metric: auc
  chunk_rows: 50000000
